name: Weekly Alpha Quant Validation Report

on:
  schedule:
    # Saturday 10:00 AM Pacific during PDT (17:00 UTC).
    # GitHub cron uses UTC. This is 9:00 AM Pacific during PST.
    - cron: '0 17 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-validation-report:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v7

    - name: Set up Python Environment
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "pandas>=2.1.0,<3.0.5" numpy yfinance

    - name: Send Weekly Validation Report to Discord
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python weekly_validation_discord.py
