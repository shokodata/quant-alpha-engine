name: Automated Market Engine
on:
  schedule:
    - cron: '0 * * * *' # Re-runs precisely at minute 0 of every hour
  workflow_dispatch:   # Manual button trigger

jobs:
  sweep-market:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v6        # Fixes Node.js deprecation warning

    - name: Set up Python Environment
      uses: actions/setup-python@v6    # Fixes Node.js deprecation warning

    - name: Cache Python Modules
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/alpha_engine.py') }}

    - name: Install Quant Framework Dependencies
      run: |
        pip install yfinance pandas statsmodels lxml

    - name: Execute Live Strategy Sweep
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python alpha_engine.py
