name: Automated Market Engine
on:
  schedule:
    - cron: '0 * * * *' # Re-runs precisely at minute 0 of every hour
  workflow_dispatch:   # Adds a manual button so you can trigger it from your iPhone anytime

permissions:
  contents: write      # Grants the server permission to update the alert tracking memory file

jobs:
  sweep-market:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Python Modules
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/alpha_engine.py') }}

    - name: Install Quant Framework Dependencies
      run: |
        pip install yfinance pandas statsmodels lxml

    - name: Execute Live Strategy Sweep
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python alpha_engine.py

    - name: Commit Alert Tracking Memories To Storage
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add engine_memory.json || true
        git commit -m "Sync engine loop alert state [skip ci]" || true
        git push || true
