name: Automated Market Engine
on:
  schedule:
    - cron: '0 * * * *' # Re-runs precisely at minute 0 of every hour
  workflow_dispatch:   # Manual button trigger

jobs:
  sweep-market:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache Pip Modules
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-v2

    - name: Install Dependencies (Fresh yfinance + Stable Analytics)
      run: |
        python -m pip install --upgrade pip
        # Safe bounds: Allows performance patches in Pandas 2.x, but caps at <3.0.0
        pip install "pandas>=2.1.0,<3.0.0" "statsmodels>=0.14.0" lxml html5lib
        # Force-upgrade yfinance so API patches are pulled on every run
        pip install --upgrade yfinance

    - name: Execute Live Strategy Sweep
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python alpha_engine.py
